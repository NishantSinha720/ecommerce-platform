name: E-Commerce Platform CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ecommerce_db
          MYSQL_USER: ecommerce_user
          MYSQL_PASSWORD: EcommerceApp123!
          MYSQL_ROOT_PASSWORD: RootPassword123!

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pRootPassword123!"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python manage.py check
          python manage.py migrate --noinput

      - name: Django tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py test

      - name: Python compilation
        run: python -m compileall config users products inventory orders analytics fastapi_app

  frontend:
    name: React Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build React
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose build
        run: docker compose build
